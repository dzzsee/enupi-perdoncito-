<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Me perdonas? ❤</title>
<style>
  :root{
    --deep:#b91c4f;
    --rose:#d6336c;
    --rose-soft:#ff5d8f;
    --blush:#ffd6e4;
    --ink:#5a1739;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color:var(--ink);
    overflow:hidden;
    background:
      radial-gradient(circle at 18% 16%, rgba(255,210,225,.9), transparent 46%),
      radial-gradient(circle at 85% 12%, rgba(255,233,241,.95), transparent 42%),
      radial-gradient(circle at 50% 108%, rgba(255,183,208,.55), transparent 55%),
      linear-gradient(165deg,#fff3f7 0%,#ffe3ec 34%,#ffd2e0 64%,#ffc9d9 100%);
  }
  .bg-glow{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    animation: glowShift 16s ease-in-out infinite alternate;
  }
  .bg-glow::after{
    content:""; position:absolute; inset:0;
    background:
      radial-gradient(circle at 50% 50%, rgba(255,255,255,.5), transparent 60%);
    mix-blend-mode:soft-light;
  }
  @keyframes glowShift{
    from{ filter:hue-rotate(0deg) saturate(1); }
    to{ filter:hue-rotate(12deg) saturate(1.08); }
  }

  .petal{
    position:fixed; top:0; z-index:2; pointer-events:none;
    border-radius:150% 0 150% 0;
    background:linear-gradient(210deg, var(--pc1,#ff9fbe), var(--pc2,#e0567f));
    box-shadow:inset -2px -3px 4px rgba(255,255,255,.35);
    animation: petalFall var(--d,12s) linear var(--delay,0s) infinite;
    will-change: transform, opacity;
  }
  @keyframes petalFall{
    0%   { transform:translate3d(0,-7vh,0) rotate(var(--r,0deg)); opacity:0; }
    7%   { opacity:.95; }
    100% { transform:translate3d(var(--x,10vw),108vh,0) rotate(calc(var(--r,0deg) + 460deg)); opacity:.85; }
  }

  .heart{
    position:fixed; left:var(--l,50%); bottom:0; z-index:2; pointer-events:none;
    font-size:var(--s,26px);
    animation: riseUp var(--d,12s) linear var(--delay,0s) infinite;
    will-change: transform, opacity;
    text-shadow:0 6px 18px rgba(214,51,108,.35);
  }
  @keyframes riseUp{
    0%   { transform:translate3d(0,0,0) scale(.5) rotate(-8deg); opacity:0; }
    10%  { opacity:.95; }
    55%  { transform:translate3d(var(--x,-4vw),-52vh,0) scale(1) rotate(5deg); opacity:.95; }
    100% { transform:translate3d(calc(var(--x,-4vw) * .5),-112vh,0) scale(1.05) rotate(-6deg); opacity:0; }
  }

  .scene{
    position:fixed; inset:0; z-index:5;
    display:grid; place-items:center;
    pointer-events:none;
  }

  .hero-wrap{
    position:absolute; width:min(46vmin,330px); pointer-events:none;
    left:50%; top:11%;
    margin-left:calc(min(46vmin,330px) / -2);
    transform-origin:50% 100%;
    animation:bob 5.5s ease-in-out infinite;
    z-index:6;
  }
  .hero-wrap img{
    width:100%; height:auto; display:block;
    filter:drop-shadow(0 18px 30px rgba(214,51,108,.28));
  }
  .hero-wrap .halo{
    position:absolute; inset:-18% -26%; z-index:-1;
    background:radial-gradient(circle, rgba(255,255,255,.85), rgba(255,255,255,0) 70%);
    filter:blur(6px);
  }
  @keyframes bob{
    0%,100%{ transform:rotate(-6deg) translateY(0); }
    50%    { transform:rotate(-3.5deg) translateY(-13px); }
  }

  .card{
    pointer-events:auto;
    position:relative;
    z-index:5;
    width:min(600px, 90vw);
    padding:5rem clamp(1.4rem,4vw,3rem) 2.6rem;
    margin-top:14vh;
    text-align:center;
    background:rgba(255,250,252,.66);
    backdrop-filter:blur(22px) saturate(160%);
    -webkit-backdrop-filter:blur(22px) saturate(160%);
    border:1px solid rgba(255,255,255,.7);
    border-radius:32px;
    box-shadow:0 30px 70px -28px rgba(214,51,108,.5), inset 0 1px 0 rgba(255,255,255,.8);
    animation:cardIn .75s cubic-bezier(.34,1.25,.64,1) .2s backwards;
  }
  @keyframes cardIn{
    from{ transform:translateY(30px) scale(.94); opacity:0; }
  }

  .title{
    font-size:clamp(2.6rem, 9vw, 4.6rem);
    font-weight:800;
    line-height:1.04;
    letter-spacing:-0.02em;
    background:linear-gradient(115deg,var(--deep),var(--rose-soft) 55%,var(--deep));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .sub{ margin-top:.9rem; font-size:clamp(1.02rem,3vw,1.22rem); line-height:1.55; color:#7d2447; }
  .sub b{ color:var(--deep); }

  .actions{
    position:relative;
    margin-top:2.2rem;
    height:88px;
  }
  .btn{
    display:inline-block;
    border:none; cursor:pointer;
    font-family:inherit; font-weight:800;
    letter-spacing:.01em;
    border-radius:999px;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:focus-visible{ outline:3px solid rgba(214,51,108,.5); outline-offset:3px; }
  .btn-yes{
    padding:.95rem 2.9rem;
    font-size:clamp(1.3rem,3.6vw,1.6rem);
    color:#fff;
    background:linear-gradient(135deg,var(--rose-soft),var(--rose) 60%,var(--deep));
    box-shadow:0 16px 34px -10px rgba(214,51,108,.6), inset 0 1px 0 rgba(255,255,255,.45);
    transition:box-shadow .25s ease;
    position:relative; z-index:2;
  }
  .btn-yes:active{ box-shadow:0 8px 18px -8px rgba(214,51,108,.6), inset 0 1px 0 rgba(255,255,255,.45); }
  .btn-no{
    position:absolute; right:10%; bottom:6px; z-index:1;
    padding:.55rem 1.5rem;
    font-size:1.04rem;
    color:var(--deep);
    background:rgba(255,255,255,.5);
    border:2px solid rgba(185,28,79,.45);
    box-shadow:0 10px 22px -12px rgba(185,28,79,.5);
    will-change:transform;
  }

  .dec{
    position:fixed; z-index:3; pointer-events:none;
    filter:drop-shadow(0 14px 22px rgba(214,51,108,.22));
    animation:decFloat 6s ease-in-out infinite;
  }
  .dec img{ width:100%; height:auto; display:block; }
  @keyframes decFloat{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%    { transform:translateY(-10px) rotate(2deg); }
  }
  .d1{ left:2.5vmin; top:7vh; width:min(9vw,108px); }
  .d2{ right:2.5vmin; top:5vh; width:min(8vw,98px); animation-delay:-1.5s; }
  .d3{ left:1.2vmin; top:40vh; width:min(16vw,158px); animation-delay:-3s; }
  .d4{ right:1.5vmin; top:46vh; width:min(13vw,132px); animation-delay:-4.4s; }
  .d5{ left:11vmin; bottom:10vh; width:min(11vw,116px); animation-delay:-2.1s; }
  .d6{ right:11vmin; bottom:12vh; width:min(11vw,116px); animation-delay:-5s; }

  .vine{ position:fixed; z-index:4; pointer-events:none; }
  .vine svg{ display:block; width:100%; height:100%; overflow:visible; }
  .vine-l{ left:0; bottom:0; width:34vmin; height:50.2vmin; }
  .vine-r{ right:0; bottom:0; }
  .stem{ fill:none; stroke:url(#vineG); stroke-width:6; stroke-linecap:round;
    stroke-dasharray:1; stroke-dashoffset:1;
    animation:draw 2.4s cubic-bezier(.5,0,.25,1) .35s forwards; }
  .sprout{ opacity:0; animation:pop .7s ease-out forwards; }
  @keyframes draw{ to{ stroke-dashoffset:0; } }
  @keyframes pop{ from{ opacity:0; transform:scale(.2); } to{ opacity:1; transform:scale(1); } }
  .sway-l{ transform-origin:30px 560px; animation:sway 7.5s ease-in-out infinite alternate 2.6s; }
  .sway-r{ transform-origin:calc(30px * -1) 560px; animation:sway 7.5s ease-in-out infinite alternate-reverse 2.6s; }
  @keyframes sway{
    from{ transform:rotate(-1.4deg); }
    to{ transform:rotate(1.5deg); }
  }

  .overlay{
    position:fixed; inset:0; z-index:50;
    display:grid; place-items:center;
    background:rgba(255,240,246,.55);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    opacity:0; visibility:hidden;
    transition:opacity .35s ease, visibility .35s ease;
  }
  .overlay.show{ opacity:1; visibility:visible; }
  .overlay-in{
    text-align:center;
    max-width:min(600px,90vw);
    padding:2.6rem clamp(1.4rem,4vw,3rem);
    background:rgba(255,252,254,.8);
    border:1px solid rgba(255,255,255,.8);
    border-radius:30px;
    box-shadow:0 34px 80px -30px rgba(214,51,108,.55);
    transform:scale(.85); opacity:0;
    transition:transform .5s cubic-bezier(.34,1.45,.64,1), opacity .35s ease;
  }
  .overlay.show .overlay-in{ transform:scale(1); opacity:1; }
  .overlay-big{
    font-size:clamp(2rem,7vw,3.4rem); font-weight:800; letter-spacing:-0.02em;
    background:linear-gradient(115deg,var(--deep),var(--rose-soft));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .overlay-sub{ margin-top:.8rem; font-size:clamp(1.05rem,3vw,1.3rem); color:#7d2447; }
  .pulse{ display:inline-block; margin-top:1rem; font-size:clamp(2.4rem,8vw,4rem);
    animation:thump 1s ease-in-out infinite; }
  @keyframes thump{ 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.18); } }

  .burst{
    position:fixed; z-index:49; pointer-events:none;
    animation:burstFly .9s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes burstFly{
    0%{ transform:translate(0,0) scale(.4); opacity:1; }
    100%{ transform:translate(var(--xx,0),var(--yy,0)) scale(var(--zs,1)); opacity:0; }
  }

  @media (max-width:820px){
    .d2,.d3,.d4,.d5{ display:none; }
    .card{ margin-top:16vh; }
  }
  @media (max-width:600px){
    .d1,.d6{ display:none; }
    .card{ margin-top:18vh; padding-top:4.4rem; }
  }

  @media (prefers-reduced-motion: reduce){
    .bg-glow,.vine,.petal,.heart,.dec,.hero-wrap{ animation:none !important; }
    .stem{ stroke-dasharray:none; stroke-dashoffset:0; animation:none; }
    .sprout{ opacity:1; transform:none; animation:none; }
    .hero-wrap{ transform:rotate(-4deg); }
    .card{ animation:none; }
    .btn-no{ right:6%; bottom:auto; top:6px; }
  }
</style>
</head>
<body>

    </g>
  </svg>
</div>

<div class="dec d1"><img src="img/snoopy_90.png" alt="Snoopy"></div>

<div class="scene">
  <div class="hero-wrap">
    <div class="halo"></div>
    <img src="img/snoopy_98.png" alt="Snoopy enamorado">
  </div>

  <div class="card" role="main">
    <h1 class="title" id="title">¿Me perdonas?</h1>
    <p class="sub" id="lines">
      Sé que metí la pata y partí tu corazoncito en trocitos…<br>
      Te quiero como quiero a snoopy.<br>
      No quiero que etemos asi 🥺. <b>Perdóname, preciosa </b>.
    </p>

      <button class="btn btn-yes" id="yesBtn">¡SÍ, te perdono! ❤</button>

    </div>
  </div>
</div>

<div class="overlay" id="overlay" aria-live="assertive">
  <div class="overlay-in">
    <div class="overlay-big" id="celebrateTitle">Yo sabia que ibas a decir que si</div>
    <div class="overlay-sub" id="celebrateSub">Te quelo más de lo que Snoopy quele a Woodstock (o pajarraco amarillo para la chaviza)</div>
    <div class="pulse">💖</div>
  </div>
</div>

<script>
(function(){
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var PETAL_PALETTE = [
    ['#ff9fbe','#e0567f'], ['#ffb7cd','#ec4e82'], ['#ffd6e4','#f26a95'],
    ['#ffc1cf','#d6336c'], ['#ff8fb2','#c73263']
  ];
  function spawnPetals(n){
    var body = document.body;
    for(var i=0;i<n;i++){
      var p = document.createElement('span');
      var c = PETAL_PALETTE[Math.floor(Math.random()*PETAL_PALETTE.length)];
      var size = 9 + Math.random()*9;
      p.className = 'petal';
      p.style.left = (Math.random()*100) + 'vw';
      p.style.width = size + 'px';
      p.style.height = (size*1.35) + 'px';
      p.style.setProperty('--pc1',c[0]);
      p.style.setProperty('--pc2',c[1]);
      p.style.setProperty('--d', (9+Math.random()*10).toFixed(1)+'s');
      p.style.setProperty('--x', ((Math.random()*26-13).toFixed(1))+'vw');
      p.style.setProperty('--r', (Math.random()*360).toFixed(0)+'deg');
      p.style.setProperty('--delay', (Math.random()*-16).toFixed(1)+'s');
      body.appendChild(p);
    }
  }

  var HEARTS = ['💖','💗','💘','❤️','💕','🌸','🩷'];
  function spawnHearts(n){
    var body = document.body;
    for(var i=0;i<n;i++){
      var h = document.createElement('span');
      h.className = 'heart';
      h.textContent = HEARTS[Math.floor(Math.random()*HEARTS.length)];
      h.style.left = (3+Math.random()*94) + 'vw';
      h.style.fontSize = (16+Math.random()*22) + 'px';
      h.style.setProperty('--x', ((Math.random()*18-9).toFixed(1))+'vw');
      h.style.setProperty('--d', (9+Math.random()*12).toFixed(1)+'s');
      h.style.setProperty('--delay', (Math.random()*-14).toFixed(1)+'s');
      body.appendChild(h);
    }
  }

  if(!reduce){
    spawnPetals(window.innerWidth > 700 ? 26 : 15);
    spawnHearts(16);
  }

  var actions = document.getElementById('actions');
  var yesBtn = document.getElementById('yesBtn');
  var noBtn = document.getElementById('noBtn');

  var TAUNTS = ['NO 😜','¡NOO!','¡JA!','Piénsalo…','¿Segura?','Apuraaaa','No me vor a rendir','Inténtalo con mas fuerza','Eres terca ','Ya di que siiiii'];
  var dodge = 0;

  function flee(){
    if(reduce) return;
    var r = actions.getBoundingClientRect();
    var bw = noBtn.offsetWidth, bh = noBtn.offsetHeight;
    var pad = 10;
    var nx = pad + Math.random()*(r.width - bw - pad*2);
    var ny = pad + Math.random()*(r.height - bh - pad*2);
    var rect = noBtn.getBoundingClientRect();
    var curX = rect.left - r.left;
    var curY = rect.top - r.top;
    noBtn.animate([
      { transform:'translate('+curX+'px,'+curY+'px)' },
      { transform:'translate('+nx+'px,'+(ny-6)+'px)' },
      { transform:'translate('+nx+'px,'+ny+'px)', offset:.88 },
      { transform:'translate('+nx+'px,'+(ny+3)+'px)', offset:.94 },
      { transform:'translate('+nx+'px,'+ny+'px)' }
    ], { duration:420, easing:'cubic-bezier(.2,1.4,.35,1)' });
    dodge++;
    if(dodge < TAUNTS.length) noBtn.textContent = TAUNTS[dodge];
    var s = Math.min(1.45, 1 + dodge*0.055);
    yesBtn.animate([
      { transform:'scale('+(s-0.06)+')' },
      { transform:'scale('+s+')' }
    ], { duration:320, easing:'cubic-bezier(.34,1.56,.64,1)' });
  }

  ['pointerenter','pointerdown','touchstart','focus'].forEach(function(ev){
    noBtn.addEventListener(ev, function(e){ if(ev!=='focus'||e.detail!==undefined) e.preventDefault(); flee(); }, {passive:false});
  });

  yesBtn.addEventListener('pointerdown', function(){
    yesBtn.animate([
      { transform:'scale(.94)' }
    ], { duration:120, easing:'ease-out' });
  });
  yesBtn.addEventListener('pointerup', function(){ pulseYes(); });
  yesBtn.addEventListener('click', celebrate);
  yesBtn.addEventListener('keydown', function(e){ if(e.key==='Enter'||e.key===' ') celebrate(); });

  function pulseYes(){
    yesBtn.animate([
      { transform:'scale(.94)' },
      { transform:'scale(1.08)' },
      { transform:'scale(1)' }
    ], { duration:420, easing:'cubic-bezier(.34,1.45,.64,1)' });
  }

  function burst(x,y){
    var body = document.body;
    var emoji = ['💖','💗','💘','✨','🌸','❤️','💕','🌹'];
    for(var i=0;i<26;i++){
      var b = document.createElement('span');
      b.className = 'burst';
      b.textContent = emoji[i%emoji.length];
      b.style.left = x+'px';
      b.style.top = y+'px';
      b.style.fontSize = (16+Math.random()*22)+'px';
      var ang = Math.random()*Math.PI*2;
      var dist = 80 + Math.random()*180;
      b.style.setProperty('--xx', (Math.cos(ang)*dist)+'px');
      b.style.setProperty('--yy', (Math.sin(ang)*dist - 60)+'px');
      b.style.setProperty('--zs', (0.8+Math.random()*0.9).toFixed(2));
      b.style.animationDelay = (Math.random()*0.12)+'s';
      body.appendChild(b);
      setTimeout(function(el){ el.remove(); }, 1300);
      setTimeout(function(el){ if(el && el.parentNode) el.parentNode.removeChild(el); }.bind(null,b),1300);
    }
  }

  function chime(){
    try{
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return;
      var ctx = new Ctx();
      var notes = [[523.25,0],[659.25,.12],[783.99,.24],[1046.5,.4]];
      notes.forEach(function(n){
        var o = ctx.createOscillator();
        var g = ctx.createGain();
        o.type = 'sine';
        o.frequency.value = n[0];
        g.gain.setValueAtTime(0.0001, ctx.currentTime + n[1]);
        g.gain.exponentialRampToValueAtTime(0.12, ctx.currentTime + n[1] + 0.03);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + n[1] + 0.7);
        o.connect(g); g.connect(ctx.destination);
        o.start(ctx.currentTime + n[1]);
        o.stop(ctx.currentTime + n[1] + 0.75);
      });
    }catch(e){}
  }

  function celebrate(){
    if(celebrate.done){ return; }
    celebrate.done = true;
    var r = yesBtn.getBoundingClientRect();
    burst(r.left + r.width/2, r.top + r.height/2);
    pulseYes();
    if(navigator.vibrate){ try{ navigator.vibrate([40,50,80]); }catch(e){} }
    chime();
    setTimeout(function(){
      var o = document.getElementById('overlay');
      o.classList.add('show');
      o.querySelector('.overlay-in').animate([
        { transform:'scale(.7) rotate(-3deg)', opacity:0 },
        { transform:'scale(1)', opacity:1 }
      ], { duration:500, easing:'cubic-bezier(.34,1.4,.64,1)' });
    }, 220);
  }
})();
</script>
</body>
</html>
